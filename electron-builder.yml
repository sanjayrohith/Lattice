# electron-builder configuration for Lattice.
#
# `npm run package` builds the electron-vite bundles first (`out/main`,
# `out/preload`, `out/renderer`) and then packages them for the host
# platform; `package:mac`/`package:win`/`package:linux` force a specific
# target. Native modules (better-sqlite3) are rebuilt against Electron's
# ABI by `postinstall`'s `electron-builder install-app-deps`, and are
# excluded from the asar archive below since a native addon cannot be
# loaded from inside one.
appId: com.sanjayrohith.lattice
productName: Lattice
copyright: Copyright © sanjayrohith

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - "!**/*.ts"
  - "!**/*.map"

asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**/*"

# A stable, reproducible artifact name across platforms and architectures
# — no build-machine-specific or timestamp-derived component — so two
# builds of the same version+platform+arch always produce the same
# filename.
artifactName: "${productName}-${version}-${platform}-${arch}.${ext}"

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  # Required for notarization. Signing itself picks up the identity from
  # the CSC_LINK/CSC_KEY_PASSWORD env vars (electron-builder's standard
  # convention) — unset in an unsigned dev build, in which case
  # electron-builder skips signing and afterSign below is a no-op.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

# Runs after mac code signing; submits the app for notarization via
# @electron/notarize. Reads APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
# APPLE_TEAM_ID from the environment and skips itself entirely — logging
# why — when they are absent, so a local unsigned dev build never
# blocks on missing Apple credentials.
afterSign: build/notarize.cjs

win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  # Signing identity comes from the same CSC_LINK/CSC_KEY_PASSWORD env
  # vars as mac, or CSC_IDENTITY_AUTO_DISCOVERY on a machine with a
  # certificate already installed in the Windows certificate store.

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  category: Development

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# electron-updater's feed. Point PUBLISH_URL at the real release host
# before shipping; generic/PUBLISH_URL keeps this config valid (and the
# updater's `checkForUpdates` a clean no-op-if-unreachable) without
# committing to a specific hosting provider up front.
publish:
  provider: generic
  url: ${env.PUBLISH_URL}

